<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a3a6b">實習 3-2　NPN 及 PNP 之判別——找出基極</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#666666">隨堂作業筆記重繪　｜　指針電表 R×1 kΩ（先短接兩棒做 0 Ω 調整）</text>
  <line x1="40" y1="74" x2="920" y2="74" stroke="#2b6cb0" stroke-width="2"/>

  <rect x="30" y="92" width="430" height="28" fill="#d6e8f7"/>
  <text x="42" y="112" font-size="16" font-weight="bold" fill="#1a3a6b">章節與儀表設定</text>
  <text x="42" y="146" font-size="14" fill="#1a3a6b">Ch 3-2　NPN 及 PNP 判別：找到 B，但 C、E 待定</text>
  <text x="42" y="173" font-size="14" fill="#1a3a6b">Ch 3-3　E、B、C 接腳判別：主要目的，找到 E、C</text>
  <text x="42" y="200" font-size="14" fill="#1a3a6b">Ch 3-4　h<tspan dy="4" font-size="10">FE</tspan><tspan dy="-4">（β）測量</tspan></text>
  <text x="42" y="227" font-size="14" fill="#1a3a6b">儀表：指針電表 R×1 kΩ 檔（0 Ω 調整）</text>

  <rect x="30" y="250" width="430" height="28" fill="#d6e8f7"/>
  <text x="42" y="270" font-size="16" font-weight="bold" fill="#1a3a6b">判別步驟</text>
  <text x="42" y="304" font-size="14" fill="#1a3a6b">① 若 PN 接面會偏轉，則黑棒 → P，紅棒 → N</text>
  <text x="42" y="333" font-size="14" fill="#1a3a6b">② 找到 2P、1N → <tspan fill="#b8322c" font-weight="bold">PNP</tspan>；找到 2N、1P → <tspan fill="#b8322c" font-weight="bold">NPN</tspan></text>

  <rect x="30" y="388" width="430" height="118" rx="6" fill="#f0f7ff" stroke="#2b6cb0" stroke-width="1"/>
  <text x="42" y="414" font-size="14" font-weight="bold" fill="#1a3a6b">儀表極性（依手稿）</text>
  <text x="42" y="441" font-size="13.5" fill="#1a3a6b">指針電表電阻檔：黑棒 ⊕（內部電池正端）、紅棒 ⊖（負端）</text>
  <text x="42" y="467" font-size="13.5" fill="#1a3a6b">偏轉＝PN 接面順向導通（低電阻）</text>
  <text x="42" y="493" font-size="13.5" fill="#b8322c">偏轉大小只作相對判斷，不能當成精確 h<tspan dy="3.5" font-size="9.5">FE</tspan><tspan dy="-3.5">。</tspan></text>

  <line x1="467" y1="100" x2="467" y2="520" stroke="#cccccc" stroke-width="1"/>

  <rect x="484" y="92" width="446" height="28" fill="#d6e8f7"/>
  <text x="496" y="112" font-size="16" font-weight="bold" fill="#1a3a6b">電晶體接腳圖（腳號由左至右 1、2、3）</text>

  <g>
