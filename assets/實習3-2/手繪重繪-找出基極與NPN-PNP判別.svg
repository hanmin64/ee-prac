    <text x="733" y="338" text-anchor="middle" font-size="12" fill="#888888">N</text>
    <text x="705" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a6b">2SA733</text>
    <text x="705" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8322c">PNP</text>
  </g>

