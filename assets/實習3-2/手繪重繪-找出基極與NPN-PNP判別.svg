    <line x1="733" y1="232" x2="733" y2="274" stroke="#1a3a6b" stroke-width="2"/>
    <text x="677" y="294" text-anchor="middle" font-size="14" fill="#1a3a6b">1</text>
    <text x="705" y="294" text-anchor="middle" font-size="14" fill="#1a3a6b">2</text>
