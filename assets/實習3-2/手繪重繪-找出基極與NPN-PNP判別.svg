    <text x="583" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a6b">B</text>
    <text x="527" y="338" text-anchor="middle" font-size="12" fill="#888888">N</text>
    <text x="555" y="338" text-anchor="middle" font-size="12" fill="#888888">N</text>
    <text x="583" y="338" text-anchor="middle" font-size="12" fill="#888888">P</text>
    <text x="555" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a6b">2SC945</text>
    <text x="555" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8322c">NPN</text>
  </g>

