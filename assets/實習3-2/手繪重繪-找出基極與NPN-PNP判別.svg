    <text x="883" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a6b">C</text>
    <text x="827" y="338" text-anchor="middle" font-size="12" fill="#888888">N</text>
    <text x="855" y="338" text-anchor="middle" font-size="12" fill="#888888">P</text>
    <text x="883" y="338" text-anchor="middle" font-size="12" fill="#888888">N</text>
    <text x="855" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a6b">2N2222</text>
    <text x="855" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8322c">NPN</text>
  </g>

  <line x1="40" y1="540" x2="920" y2="540" stroke="#cccccc" stroke-width="1"/>
  <text x="40" y="566" font-size="12.5" fill="#888888">依手繪隨堂作業筆記忠實重繪</text>
  <text x="920" y="566" text-anchor="end" font-size="12.5" fill="#666666" fill-opacity="0.75">大安高工控制科張漢民</text>
