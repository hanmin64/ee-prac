<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" font-family="'Times New Roman','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b8322c"/>
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    <clipPath id="card-left-clip">
      <rect x="38" y="88" width="626" height="646" rx="16" ry="16"/>
    </clipPath>
    <clipPath id="card-right-clip">
      <rect x="712" y="88" width="626" height="646" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1376" height="768" fill="#ffffff"/>

  <!-- Top Title -->
  <text x="688" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">實習 3-4 工作二：測量 IB、IC、IE 與計算增益 α、β、γ</text>
  <text x="1336" y="38" text-anchor="end" font-size="14" fill="#718096" font-family="'Microsoft JhengHei',sans-serif">大安高工控制科張漢民</text>

  <!-- ==================== LEFT CARD ==================== -->
  <g clip-path="url(#card-left-clip)">
    <rect x="38" y="88" width="626" height="646" fill="#ffffff"/>
    <rect x="38" y="88" width="626" height="52" fill="#cfe2f3"/>
    <line x1="38" y1="140" x2="664" y2="140" stroke="#0f2942" stroke-width="3.5"/>
  </g>
  <rect x="38" y="88" width="626" height="646" rx="16" ry="16" fill="none" stroke="#0f2942" stroke-width="3.5"/>
  <text x="351" y="123" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2942" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">固定偏壓電路 (Fixed-Bias Circuit)</text>

  <!-- Left Card Body: Circuit Diagram (Centered & Shifted Right) -->
  <!-- VCC Rail & Box -->
  <line x1="190" y1="200" x2="450" y2="200" stroke="#000000" stroke-width="2.5"/>
  <line x1="310" y1="170" x2="310" y2="200" stroke="#000000" stroke-width="2.5" marker-start="url(#arrow-black)"/>
  <text x="285" y="165" text-anchor="end" font-size="22" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="14" font-style="normal" dy="5">CC</tspan><tspan font-size="22" font-style="normal" dy="-5"> = </tspan></text>
  <rect x="295" y="145" width="65" height="30" rx="2" fill="#ffffff" stroke="#b8322c" stroke-width="2"/>
  <text x="327" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8322c">10 V</text>

  <!-- Left Branch: RB = R1 + VR at x=225 -->
  <circle cx="225" cy="200" r="4" fill="#000000"/>
  
  <!-- R1 Zigzag -->
  <path d="M 225 200 L 225 212.5 L 214 218.9 L 236 225.4 L 214 231.8 L 236 238.2 L 214 244.6 L 236 251.1 L 225 257.5 L 225 270" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="200" y="240" text-anchor="end" font-size="18" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="13" font-style="normal" dy="4">1</tspan><tspan font-size="18" font-style="normal" dy="-4"> = 1 MΩ</tspan></text>

  <!-- Intermediate line -->
  <line x1="225" y1="270" x2="225" y2="285" stroke="#000000" stroke-width="2.5"/>

  <!-- VR Zigzag -->
  <path d="M 225 285 L 225 300.0 L 214 307.1 L 236 314.3 L 214 321.4 L 236 328.6 L 214 335.7 L 236 342.9 L 225 350.0 L 225 365" fill="none" stroke="#000000" stroke-width="2.5"/>
  <line x1="180" y1="345" x2="240" y2="305" stroke="#000000" stroke-width="2" marker-end="url(#arrow-black)"/>
  <text x="200" y="325" text-anchor="end" font-size="18" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="13" font-style="normal" dy="4">R</tspan><tspan font-size="18" font-style="normal" dy="-4"> = 1 MΩ</tspan></text>

  <!-- Curly bracket for RB (Well clear of x=38 border!) -->
  <path d="M 125 220 Q 115 220 115 275 Q 115 285 105 285 Q 115 285 115 295 Q 115 350 125 350" fill="none" stroke="#000000" stroke-width="1.8"/>
  <text x="95" y="292" text-anchor="end" font-size="20" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="14" font-style="normal" dy="4">B</tspan></text>

  <!-- Note on RB Range (x=95, comfortably padded from x=38) -->
  <text x="95" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8322c" font-family="'Microsoft JhengHei',sans-serif">RB 在此題必須在</text>
  <text x="95" y="400" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b8322c">2M ～ 2.5M Ω</text>

  <!-- Lead from VR to Base -->
  <line x1="225" y1="365" x2="225" y2="400" stroke="#000000" stroke-width="2.5"/>
  <circle cx="225" cy="400" r="4" fill="#000000"/>
  <line x1="225" y1="400" x2="365" y2="400" stroke="#000000" stroke-width="2.5"/>

  <!-- IB red arrow -->
  <line x1="265" y1="385" x2="315" y2="385" stroke="#b8322c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="290" y="375" text-anchor="middle" font-size="18" font-style="italic" font-weight="bold" fill="#b8322c">I<tspan font-size="13" font-style="normal" dy="4">B</tspan></text>

  <!-- Right Branch: RC at x=415 -->
  <circle cx="415" cy="200" r="4" fill="#000000"/>
  <path d="M 415 200 L 415 215.0 L 404 222.9 L 426 230.7 L 404 238.6 L 426 246.4 L 404 254.3 L 426 262.1 L 415 270.0 L 415 285" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="440" y="250" font-size="19" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="13" font-style="normal" dy="4">C</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 4.7 kΩ</tspan></text>

  <!-- IC red arrow -->
  <line x1="415" y1="285" x2="415" y2="365" stroke="#000000" stroke-width="2.5"/>
  <line x1="435" y1="295" x2="435" y2="335" stroke="#b8322c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="448" y="315" font-size="18" font-style="italic" font-weight="bold" fill="#b8322c">I<tspan font-size="13" font-style="normal" dy="4">C</tspan></text>
  <text x="448" y="333" font-size="15" font-weight="bold" fill="#b8322c">≈ 1.06 mA</text>

  <!-- Transistor: 2N2222 (Base at x=365, Collector/Emitter vertically at x=415) -->
  <line x1="365" y1="375" x2="365" y2="425" stroke="#000000" stroke-width="4.5"/>
  <!-- Collector pin -->
  <line x1="365" y1="385" x2="415" y2="365" stroke="#000000" stroke-width="2.5"/>

  <!-- Emitter pin with arrow -->
  <line x1="365" y1="415" x2="415" y2="435" stroke="#000000" stroke-width="2.5"/>
  <polygon points="395,432 415,435 402,420" fill="#000000"/>

  <!-- Transistor label -->
  <text x="425" y="398" font-size="18" font-weight="bold" fill="#000000">2N2222</text>

  <!-- VCE Voltage Marker (Spans x=425..490, well inside x=664) -->
  <text x="425" y="365" font-size="20" font-weight="bold" fill="#b8322c">+</text>
  <text x="425" y="445" font-size="24" font-weight="bold" fill="#b8322c">−</text>
  <text x="455" y="430" font-size="18" font-style="italic" font-weight="bold" fill="#b8322c">V<tspan font-size="13" font-style="normal" dy="4">CE</tspan><tspan font-size="18" font-style="normal" dy="-4"> = 5 V</tspan></text>

  <!-- Lead from Emitter to Ground -->
  <line x1="415" y1="435" x2="415" y2="480" stroke="#000000" stroke-width="2.5"/>
  <!-- IE red arrow -->
  <line x1="435" y1="445" x2="435" y2="475" stroke="#b8322c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="448" y="465" font-size="18" font-style="italic" font-weight="bold" fill="#b8322c">I<tspan font-size="13" font-style="normal" dy="4">E</tspan></text>

  <!-- Ground -->
  <line x1="395" y1="480" x2="435" y2="480" stroke="#000000" stroke-width="3"/>
  <line x1="403" y1="486" x2="427" y2="486" stroke="#000000" stroke-width="2.2"/>
  <line x1="409" y1="492" x2="421" y2="492" stroke="#000000" stroke-width="1.5"/>

  <!-- Left Card Bottom: KVL Equations -->
  <g transform="translate(65, 535)">
    <text x="0" y="24" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">【輸入 K.V.L. 方程式】</text>
    <text x="35" y="58" font-size="21" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="14" font-style="normal" dy="4">CC</tspan><tspan font-size="21" font-style="normal" dy="-4"> = </tspan>I<tspan font-size="14" font-style="normal" dy="4">B</tspan>R<tspan font-size="14" font-style="normal" dy="4">B</tspan><tspan font-size="21" font-style="normal" dy="-8"> + </tspan>V<tspan font-size="14" font-style="normal" dy="4">BE</tspan></text>
    <text x="460" y="58" font-size="17" font-weight="bold" fill="#555555" font-family="'Microsoft JhengHei',sans-serif">—— ① 式</text>

    <text x="0" y="105" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">【輸出 K.V.L. 方程式】</text>
    <text x="35" y="139" font-size="21" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="14" font-style="normal" dy="4">CC</tspan><tspan font-size="21" font-style="normal" dy="-4"> = </tspan>I<tspan font-size="14" font-style="normal" dy="4">C</tspan>R<tspan font-size="14" font-style="normal" dy="4">C</tspan><tspan font-size="21" font-style="normal" dy="-8"> + </tspan>V<tspan font-size="14" font-style="normal" dy="4">CE</tspan></text>
    <text x="460" y="139" font-size="17" font-weight="bold" fill="#555555" font-family="'Microsoft JhengHei',sans-serif">—— ② 式</text>
  </g>


  <!-- ==================== RIGHT CARD ==================== -->
  <g clip-path="url(#card-right-clip)">
    <rect x="712" y="88" width="626" height="646" fill="#ffffff"/>
    <rect x="712" y="88" width="626" height="52" fill="#cfe2f3"/>
    <line x1="712" y1="140" x2="1338" y2="140" stroke="#0f2942" stroke-width="3.5"/>
  </g>
  <rect x="712" y="88" width="626" height="646" rx="16" ry="16" fill="none" stroke="#0f2942" stroke-width="3.5"/>
  <text x="1025" y="123" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2942" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">中點調校推導、IC 理論值與增益計算</text>

  <!-- Right Card Body -->
  <!-- Block 1: Tuning -->
  <g transform="translate(740, 160)">
    <text x="0" y="24" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">1. 調整 VR，使得 </text>
    <text x="175" y="24" font-size="21" font-style="italic" font-weight="bold" fill="#b8322c">V<tspan font-size="14" font-style="normal" dy="4">CE</tspan><tspan font-size="21" font-style="normal" dy="-4"> = </tspan><tspan font-size="17" font-style="normal">½</tspan>V<tspan font-size="14" font-style="normal" dy="4">CC</tspan><tspan font-size="21" font-style="normal" dy="-4"> = 5 V</tspan></text>
    <text x="355" y="24" font-size="19" font-weight="bold" fill="#b8322c" font-family="'Microsoft JhengHei',sans-serif">（中點）</text>

    <!-- Tuning rule banner -->
    <text x="15" y="60" font-size="18" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">若 <tspan fill="#b8322c">VCE &lt; 5 V</tspan>，則【調大 RB 值】可使 <tspan fill="#b8322c">VCE ↑</tspan></text>

    <!-- Flow deduction box -->
    <rect x="15" y="80" width="555" height="150" rx="8" fill="#f8fafc" stroke="#0f2942" stroke-width="1.8"/>
    
    <text x="35" y="114" font-size="17" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">由 ① 式：</text>
    <rect x="120" y="94" width="45" height="30" rx="4" fill="#ffffff" stroke="#b8322c" stroke-width="1.8"/>
    <text x="142" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8322c">RB ↑</text>
    
    <text x="175" y="115" font-size="18" font-weight="bold" fill="#0f2942">⇒</text>

    <rect x="205" y="94" width="45" height="30" rx="4" fill="#ffffff" stroke="#b8322c" stroke-width="1.8"/>
    <text x="227" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8322c">IB ↓</text>

    <text x="260" y="115" font-size="16" fill="#555555" font-family="'Microsoft JhengHei',sans-serif">（若 VCC, VBE 不變）</text>

    <text x="175" y="154" font-size="18" font-weight="bold" fill="#0f2942">⇒</text>
    <text x="205" y="155" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">I<tspan font-size="13" font-style="normal" dy="4">C</tspan><tspan font-size="19" font-style="normal" dy="-4"> = β</tspan>I<tspan font-size="13" font-style="normal" dy="4">B</tspan><tspan font-size="19" font-style="normal" dy="-4"> ↓</tspan></text>

    <text x="35" y="200" font-size="17" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">由 ② 式：</text>
    <rect x="120" y="180" width="45" height="30" rx="4" fill="#ffffff" stroke="#b8322c" stroke-width="1.8"/>
    <text x="142" y="202" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8322c">IC ↓</text>
    
    <text x="175" y="201" font-size="18" font-weight="bold" fill="#0f2942">⇒</text>

    <rect x="205" y="180" width="55" height="30" rx="4" fill="#fff5f5" stroke="#b8322c" stroke-width="2"/>
    <text x="232" y="202" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8322c">VCE ↑</text>

    <text x="270" y="201" font-size="16" fill="#555555" font-family="'Microsoft JhengHei',sans-serif">（若 VCC, RC 不變）</text>
  </g>

  <!-- Block 2: IC Calculation -->
  <g transform="translate(740, 420)">
    <text x="0" y="24" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">2. 評估本電路 IC 值：</text>
    
    <rect x="15" y="42" width="555" height="64" rx="6" fill="#ffffff" stroke="#b8322c" stroke-width="2"/>
    
    <g transform="translate(45, 60)">
      <text x="0" y="18" font-size="22" font-style="italic" font-weight="bold" fill="#000000">I<tspan font-size="15" font-style="normal" dy="5">C</tspan><tspan font-size="22" font-style="normal" dy="-5"> = </tspan></text>
      
      <g transform="translate(48, 0)">
        <text x="50" y="8" text-anchor="middle" font-size="18" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="12" font-style="normal" dy="3">CC</tspan><tspan font-size="18" font-style="normal" dy="-3"> − V</tspan><tspan font-size="12" font-style="normal" dy="3">CE</tspan></text>
        <line x1="5" y1="14" x2="95" y2="14" stroke="#000000" stroke-width="1.8"/>
        <text x="50" y="32" text-anchor="middle" font-size="18" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="12" font-style="normal" dy="3">C</tspan></text>
      </g>

      <text x="160" y="18" font-size="22" font-weight="bold" fill="#000000"> = </text>

      <g transform="translate(195, 0)">
        <text x="45" y="8" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">10 − 5</text>
        <line x1="5" y1="14" x2="85" y2="14" stroke="#000000" stroke-width="1.8"/>
        <text x="45" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">4.7 kΩ</text>
      </g>

      <text x="295" y="18" font-size="22" font-weight="bold" fill="#000000"> = </text>
      <text x="330" y="20" font-size="25" font-weight="bold" fill="#b8322c">1.06 mA</text>
    </g>
  </g>

  <!-- Block 3: Measurements -->
  <g transform="translate(740, 545)">
    <text x="0" y="24" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">3. 實測 IB、IC、IE：</text>
    <text x="25" y="52" font-size="16.5" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">• 換接電流表時均須<tspan font-weight="bold" fill="#b8322c">「先斷電再串接」</tspan>，並驗證 <tspan font-weight="bold">IE = IB + IC</tspan>。</text>
  </g>

  <!-- Block 4: Gains Calculation -->
  <g transform="translate(740, 625)">
    <text x="0" y="24" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">4. 計算 α、β、γ：</text>
    
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="160" height="42" rx="4" fill="#ffffff" stroke="#0f2942" stroke-width="1.8"/>
      <text x="80" y="28" text-anchor="middle" font-size="18" font-style="italic" font-weight="bold" fill="#0f2942">α = <tspan font-style="normal">IC / IE</tspan></text>

      <rect x="180" y="0" width="170" height="42" rx="4" fill="#fff5f5" stroke="#b8322c" stroke-width="2"/>
      <text x="265" y="28" text-anchor="middle" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">β = <tspan font-style="normal">IC / IB</tspan></text>

      <rect x="370" y="0" width="185" height="42" rx="4" fill="#ffffff" stroke="#0f2942" stroke-width="1.8"/>
      <text x="462" y="28" text-anchor="middle" font-size="18" font-style="italic" font-weight="bold" fill="#0f2942">γ = <tspan font-style="normal">IE / IB = β + 1</tspan></text>
    </g>
  </g>

</svg>
