  <text x="522" y="402" font-size="14" fill="#1a3a6b">1. 自行假設 C、E</text>
  <text x="522" y="428" font-size="14" fill="#1a3a6b">2. 手指放 B、C 位置</text>
  <text x="522" y="454" font-size="14" fill="#1a3a6b">3. 電表黑棒 → E，紅棒 → C</text>
  <text x="522" y="480" font-size="14" fill="#1a3a6b">4. 若指針偏轉幅度較大（低電阻）→ <tspan fill="#b8322c" font-weight="bold">假設正確</tspan></text>

  <rect x="30" y="532" width="940" height="28" fill="#d6e8f7"/>
  <text x="42" y="552" font-size="16" font-weight="bold" fill="#1a3a6b">儀表極性與方法註記</text>
  <text x="42" y="590" font-size="14" fill="#1a3a6b">指針電表 R×1 kΩ 檔：黑棒 ⊕（內部電池正端）、紅棒 ⊖（內部電池負端）；手指當作電阻，接於基極(B)與集極(C)之間。</text>
  <text x="42" y="616" font-size="14" fill="#1a3a6b">比較兩次假設的偏轉：幅度較大者（低電阻）為<tspan fill="#b8322c" font-weight="bold">假設正確</tspan>；兩次量測條件應相同。</text>

  <text x="40" y="652" font-size="12.5" fill="#888888">依手繪隨堂作業筆記忠實重繪</text>
