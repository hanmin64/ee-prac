  <text x="42" y="402" font-size="14" fill="#1a3a6b">1. 自行假設 C、E</text>
  <text x="42" y="428" font-size="14" fill="#1a3a6b">2. 手指放 B、C 位置</text>
  <text x="42" y="454" font-size="14" fill="#1a3a6b">3. 電表黑棒 → C，紅棒 → E</text>
  <text x="42" y="480" font-size="14" fill="#1a3a6b">4. 若指針偏轉幅度較大（低電阻）→ <tspan fill="#b8322c" font-weight="bold">假設正確</tspan></text>
  <text x="42" y="506" font-size="14" fill="#1a3a6b">5. 否則 C、E 交換，再測一次確認</text>

