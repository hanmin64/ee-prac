<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" font-family="'Times New Roman','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b8322c"/>
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    <clipPath id="card-left-clip">
      <rect x="38" y="88" width="626" height="646" rx="16" ry="16"/>
    </clipPath>
    <clipPath id="card-right-clip">
      <rect x="712" y="88" width="626" height="646" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1376" height="768" fill="#ffffff"/>

  <!-- Top Title -->
  <text x="688" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">實習 4-2 工作一：固定式偏壓電路理論計算與量測指引</text>
  <text x="1336" y="38" text-anchor="end" font-size="14" fill="#718096" font-family="'Microsoft JhengHei',sans-serif">大安高工控制科張漢民</text>

  <!-- ==================== LEFT CARD ==================== -->
  <g clip-path="url(#card-left-clip)">
    <rect x="38" y="88" width="626" height="646" fill="#ffffff"/>
    <rect x="38" y="88" width="626" height="52" fill="#cfe2f3"/>
    <line x1="38" y1="140" x2="664" y2="140" stroke="#0f2942" stroke-width="3.5"/>
  </g>
  <rect x="38" y="88" width="626" height="646" rx="16" ry="16" fill="none" stroke="#0f2942" stroke-width="3.5"/>
  <text x="351" y="123" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2942" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">固定式偏壓電路與量測節點 (表 4-1 / 表 4-12)</text>

  <!-- Left Card Body: Circuit Diagram (Centered & Shifted Right) -->
  <!-- VCC Rail & Box -->
  <line x1="190" y1="200" x2="450" y2="200" stroke="#000000" stroke-width="2.5"/>
  <line x1="310" y1="170" x2="310" y2="200" stroke="#000000" stroke-width="2.5" marker-start="url(#arrow-black)"/>
  <text x="285" y="165" text-anchor="end" font-size="22" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="14" font-style="normal" dy="5">CC</tspan><tspan font-size="22" font-style="normal" dy="-5"> = </tspan></text>
  <rect x="295" y="145" width="65" height="30" rx="2" fill="#ffffff" stroke="#b8322c" stroke-width="2"/>
  <text x="327" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8322c">10 V</text>

  <!-- Left Branch: RB = R1 + VR at x=225 -->
  <circle cx="225" cy="200" r="4" fill="#000000"/>
  
  <path d="M 225 200 L 225 212.5 L 214 218.9 L 236 225.4 L 214 231.8 L 236 238.2 L 214 244.6 L 236 251.1 L 225 257.5 L 225 270" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="200" y="240" text-anchor="end" font-size="18" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="13" font-style="normal" dy="4">1</tspan></text>

  <line x1="225" y1="270" x2="225" y2="285" stroke="#000000" stroke-width="2.5"/>

  <path d="M 225 285 L 225 300.0 L 214 307.1 L 236 314.3 L 214 321.4 L 236 328.6 L 214 335.7 L 236 342.9 L 225 350.0 L 225 365" fill="none" stroke="#000000" stroke-width="2.5"/>
  <line x1="180" y1="345" x2="240" y2="305" stroke="#000000" stroke-width="2" marker-end="url(#arrow-black)"/>
  <text x="200" y="325" text-anchor="end" font-size="18" font-style="italic" font-weight="bold" fill="#000000">VR</text>

  <!-- Curly bracket for RB (Well clear of x=38 border!) -->
  <path d="M 125 220 Q 115 220 115 275 Q 115 285 105 285 Q 115 285 115 295 Q 115 350 125 350" fill="none" stroke="#000000" stroke-width="1.8"/>
  <text x="95" y="292" text-anchor="end" font-size="20" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="14" font-style="normal" dy="4">B</tspan></text>

  <!-- Base Lead & Node Voltage [VB] -->
  <line x1="225" y1="365" x2="225" y2="400" stroke="#000000" stroke-width="2.5"/>
  <circle cx="225" cy="400" r="4.5" fill="#000000"/>

  <!-- [ VB ] Red Outline Box -->
  <rect x="195" y="415" width="60" height="36" rx="4" fill="#ffffff" stroke="#b8322c" stroke-width="2"/>
  <text x="225" y="440" text-anchor="middle" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">V<tspan font-size="13" font-style="normal" dy="4">B</tspan></text>

  <line x1="225" y1="400" x2="365" y2="400" stroke="#000000" stroke-width="2.5"/>

  <!-- Right Branch: RC at x=415 -->
  <circle cx="415" cy="200" r="4" fill="#000000"/>
  <path d="M 415 200 L 415 215.0 L 404 222.9 L 426 230.7 L 404 238.6 L 426 246.4 L 404 254.3 L 426 262.1 L 415 270.0 L 415 285" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="440" y="250" font-size="19" font-style="italic" font-weight="bold" fill="#000000">R<tspan font-size="13" font-style="normal" dy="4">C</tspan></text>

  <!-- Collector Node & [ VC ] Red Outline Box -->
  <line x1="415" y1="285" x2="415" y2="365" stroke="#000000" stroke-width="2.5"/>
  <circle cx="415" cy="340" r="4.5" fill="#000000"/>
  
  <rect x="440" y="322" width="60" height="36" rx="4" fill="#ffffff" stroke="#b8322c" stroke-width="2"/>
  <text x="470" y="347" text-anchor="middle" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">V<tspan font-size="13" font-style="normal" dy="4">C</tspan></text>

  <!-- Transistor: 2N2222 (Base at x=365, Collector/Emitter vertically at x=415) -->
  <line x1="365" y1="375" x2="365" y2="425" stroke="#000000" stroke-width="4.5"/>
  <line x1="365" y1="385" x2="415" y2="365" stroke="#000000" stroke-width="2.5"/>

  <line x1="365" y1="415" x2="415" y2="435" stroke="#000000" stroke-width="2.5"/>
  <polygon points="395,432 415,435 402,420" fill="#000000"/>

  <!-- Emitter Node & [ VE ] Red Outline Box -->
  <line x1="415" y1="435" x2="415" y2="480" stroke="#000000" stroke-width="2.5"/>
  <circle cx="415" cy="460" r="4.5" fill="#000000"/>

  <rect x="440" y="442" width="60" height="36" rx="4" fill="#ffffff" stroke="#b8322c" stroke-width="2"/>
  <text x="470" y="467" text-anchor="middle" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">V<tspan font-size="13" font-style="normal" dy="4">E</tspan></text>

  <!-- VCE Target Indication -->
  <g transform="translate(520, 400)">
    <text x="0" y="0" font-size="20" font-weight="bold" fill="#b8322c">+</text>
    <text x="15" y="12" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">V<tspan font-size="13" font-style="normal" dy="4">CE</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 5 V</tspan></text>
    <text x="0" y="32" font-size="24" font-weight="bold" fill="#b8322c">−</text>
  </g>

  <!-- Ground -->
  <line x1="395" y1="480" x2="435" y2="480" stroke="#000000" stroke-width="3"/>
  <line x1="403" y1="486" x2="427" y2="486" stroke="#000000" stroke-width="2.2"/>
  <line x1="409" y1="492" x2="421" y2="492" stroke="#000000" stroke-width="1.5"/>

  <!-- Left Card Bottom: Definition Notes -->
  <g transform="translate(65, 550)">
    <text x="0" y="24" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">【節點電壓與接地定義】</text>
    <text x="15" y="60" font-size="17" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">• <tspan font-weight="bold">VE = 0 V</tspan>（射極直接接地為 0 電位參考點）</text>
    <text x="15" y="95" font-size="17" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">• <tspan font-weight="bold">VC = 5 V</tspan>（設定工作點 VCE = VC − VE = 5 V）</text>
    <text x="15" y="130" font-size="17" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">• <tspan font-weight="bold">VB ≈ 0.7 V</tspan>（基極對地即為 VBE 順向導通電壓）</text>
  </g>


  <!-- ==================== RIGHT CARD ==================== -->
  <g clip-path="url(#card-right-clip)">
    <rect x="712" y="88" width="626" height="646" fill="#ffffff"/>
    <rect x="712" y="88" width="626" height="52" fill="#cfe2f3"/>
    <line x1="712" y1="140" x2="1338" y2="140" stroke="#0f2942" stroke-width="3.5"/>
  </g>
  <rect x="712" y="88" width="626" height="646" rx="16" ry="16" fill="none" stroke="#0f2942" stroke-width="3.5"/>
  <text x="1025" y="123" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2942" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">理論值推導 (設 β = 250) 與量測規範</text>

  <!-- Right Card Body -->
  <!-- Block 1: Theoretical Values -->
  <g transform="translate(740, 160)">
    <rect x="0" y="0" width="105" height="34" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="52" y="24" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">理論值</text>

    <!-- Node Voltages line -->
    <text x="135" y="24" font-size="19" font-style="italic" font-weight="bold" fill="#000000">V<tspan font-size="13" font-style="normal" dy="4">E</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 0 , </tspan>V<tspan font-size="13" font-style="normal" dy="4">C</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 5 V , </tspan>V<tspan font-size="13" font-style="normal" dy="4">B</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 0.7 V</tspan></text>

    <!-- Beta & IC, IB -->
    <text x="20" y="72" font-size="19" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">設 β = 250 ，</text>

    <text x="145" y="72" font-size="19" font-style="italic" font-weight="bold" fill="#000000">I<tspan font-size="13" font-style="normal" dy="4">C</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 1.06 mA , </tspan></text>
    
    <!-- IB formula with fraction line -->
    <g transform="translate(320, 52)">
      <text x="0" y="20" font-size="19" font-style="italic" font-weight="bold" fill="#b8322c">I<tspan font-size="13" font-style="normal" dy="4">B</tspan><tspan font-size="19" font-style="normal" dy="-4"> = </tspan></text>
      <text x="45" y="10" text-anchor="middle" font-size="16" font-style="italic" font-weight="bold" fill="#b8322c">IC</text>
      <line x1="35" y1="15" x2="55" y2="15" stroke="#b8322c" stroke-width="1.8"/>
      <text x="45" y="30" text-anchor="middle" font-size="16" font-style="italic" font-weight="bold" fill="#b8322c">β</text>
      <text x="65" y="20" font-size="19" font-weight="bold" fill="#b8322c"> = 4.2 μA</text>
    </g>

    <!-- IE calculation -->
    <text x="145" y="118" font-size="19" font-style="italic" font-weight="bold" fill="#000000">I<tspan font-size="13" font-style="normal" dy="4">E</tspan><tspan font-size="19" font-style="normal" dy="-4"> = </tspan>I<tspan font-size="13" font-style="normal" dy="4">B</tspan><tspan font-size="19" font-style="normal" dy="-4"> + </tspan>I<tspan font-size="13" font-style="normal" dy="4">C</tspan><tspan font-size="19" font-style="normal" dy="-4"> = 1.064 mA</tspan></text>
  </g>

  <!-- Divider line -->
  <line x1="740" y1="300" x2="1310" y2="300" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- Block 2: Actual Measurements & Red Warning -->
  <g transform="translate(740, 320)">
    <rect x="0" y="0" width="135" height="34" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="67" y="24" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">實際測量值</text>

    <text x="30" y="75" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">① <tspan font-style="italic">V<tspan font-size="14" font-style="normal" dy="4">E</tspan></tspan> , <tspan font-style="italic">V<tspan font-size="14" font-style="normal" dy="4">B</tspan></tspan> , <tspan font-style="italic">V<tspan font-size="14" font-style="normal" dy="4">C</tspan></tspan></text>
    <text x="230" y="75" font-size="15" fill="#718096" font-family="'Microsoft JhengHei',sans-serif">（通電量測三節點電壓）</text>

    <text x="30" y="125" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">② <tspan font-style="italic">I<tspan font-size="14" font-style="normal" dy="4">E</tspan></tspan> , <tspan font-style="italic">I<tspan font-size="14" font-style="normal" dy="4">B</tspan></tspan> , <tspan font-style="italic">I<tspan font-size="14" font-style="normal" dy="4">C</tspan></tspan></text>
    <text x="230" y="125" font-size="15" fill="#718096" font-family="'Microsoft JhengHei',sans-serif">（斷電串接三支路電流表）</text>

    <text x="30" y="175" font-size="20" font-weight="bold" fill="#000000" font-family="'Microsoft JhengHei',sans-serif">③ <tspan font-style="italic">R<tspan font-size="14" font-style="normal" dy="4">E</tspan></tspan> , <tspan font-style="italic">R<tspan font-size="14" font-style="normal" dy="4">B</tspan></tspan> , <tspan font-style="italic">R<tspan font-size="14" font-style="normal" dy="4">C</tspan></tspan></text>

    <!-- RED CRITICAL WARNING BANNER -->
    <rect x="25" y="200" width="545" height="185" rx="8" fill="#fff5f5" stroke="#b8322c" stroke-width="2.5"/>
    <text x="297" y="240" text-anchor="middle" font-size="24" font-weight="bold" fill="#b8322c" font-family="'Microsoft JhengHei',sans-serif">（必須斷開電路連接）</text>
    <text x="297" y="282" text-anchor="middle" font-size="28" font-weight="bold" fill="#b8322c" font-family="'Microsoft JhengHei',sans-serif">獨立測量</text>

    <line x1="45" y1="305" x2="550" y2="305" stroke="#feb2b2" stroke-width="1.2"/>
    
    <text x="50" y="332" font-size="15" fill="#2d3748" font-family="'Microsoft JhengHei',sans-serif">• 關閉電源後，將待測電阻至少拔起一端與電路隔離再測。</text>
    <text x="50" y="358" font-size="15" fill="#2d3748" font-family="'Microsoft JhengHei',sans-serif">• <tspan font-weight="bold" fill="#b8322c">未隔離後果：</tspan>電表電壓會使晶體 PN 接面微導通，造成嚴重測量誤差！</text>
  </g>

</svg>
