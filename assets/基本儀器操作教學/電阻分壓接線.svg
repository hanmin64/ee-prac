<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">兩顆 1 kΩ 電阻的分壓實驗</text>
  <circle cx="290" cy="105" r="9" fill="#d22"/><text x="245" y="112" text-anchor="end" font-family="sans-serif" font-size="27" fill="#d22">+5 V</text>
  <path d="M290 105 V155" stroke="#333" stroke-width="7"/>
  <polyline points="290,155 250,185 330,220 250,255 330,290 290,320" fill="none" stroke="#333" stroke-width="6"/>
  <text x="380" y="235" font-family="sans-serif" font-size="26">R1 = 1 kΩ</text>
  <circle cx="290" cy="350" r="12" fill="#f0a000" stroke="#7a5200" stroke-width="3"/>
  <path d="M290 320 V350 M290 350 V380" stroke="#333" stroke-width="7"/>
  <polyline points="290,380 250,405 330,430 290,455" fill="none" stroke="#333" stroke-width="6"/>
  <text x="380" y="425" font-family="sans-serif" font-size="26">R2 = 1 kΩ</text>
  <path d="M290 455 V475" stroke="#333" stroke-width="7"/>
  <line x1="250" y1="475" x2="330" y2="475" stroke="#2675d8" stroke-width="8"/><line x1="262" y1="492" x2="318" y2="492" stroke="#2675d8" stroke-width="8"/>
  <path d="M302 350 H710" stroke="#f0a000" stroke-width="7"/>
  <circle cx="710" cy="350" r="11" fill="#f0a000"/>
  <text x="730" y="340" font-family="sans-serif" font-size="27" font-weight="700">Vout ≈ 2.5 V</text>
  <text x="730" y="378" font-family="sans-serif" font-size="22">接三用電表或示波器 CH1</text>
  <rect x="620" y="125" width="470" height="110" rx="16" fill="#edf6ff" stroke="#2675d8" stroke-width="3"/>
  <text x="855" y="168" text-anchor="middle" font-family="sans-serif" font-size="24">Vout = Vin × R2 ÷ (R1 + R2)</text>
  <text x="855" y="207" text-anchor="middle" font-family="sans-serif" font-size="24">= 5 V × 1 kΩ ÷ 2 kΩ = 2.5 V</text>
</svg>
